<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-mail Védelem Teszt</title>
    
    <!-- 1. A Google reCAPTCHA betöltése -->
    <script src="https://google.com" async defer></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f9f9f9;
            color: #333;
        }
        .container {
            max-width: 500px;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h3 {
            margin-top: 0;
            color: #222;
        }
        .leiras {
            margin-bottom: 20px;
            font-size: 15px;
        }
        #email-doboz {
            margin-top: 20px;
            padding: 15px;
            border-radius: 4px;
            display: none; /* Alapértelmezetten rejtve van */
            font-weight: bold;
            font-size: 16px;
        }
        .siker {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
    </style>
</head>
<body>

<div class="container">
    <h3>Lépjen velünk kapcsolatba</h3>
    <p class="leiras">Az e-mail cím megtekintéséhez kérjük, igazolja, hogy Ön ember:</p>

    <!-- 2. A reCAPTCHA doboz (A data-sitekey-be a NYILVÁNOS kulcsát másolja!) -->
    <div class="g-recaptcha" 
         data-sitekey="IDE_MÁSOLJA_A_NYILVÁNOS_SITE_KEY_KÓDOT" 
         data-callback="recaptchaSikeres">
    </div>

    <!-- 3. Ide fog bekerülni az e-mail cím a sikeres ellenőrzés után -->
    <div id="email-doboz" class="siker">
        E-mail cím: <span id="email-helye"></span>
    </div>
</div>

<script>
    // Ez a függvény automatikusan lefut, ha a felhasználó kipipálja a reCAPTCHA-t
    function recaptchaSikeres(response) {
        if (response.length > 0) {
            // Biztonsági trükk: darabokból rakjuk össze az e-mailt, hogy a spambotok ne olvassák ki a forráskódból
            var felhasznalo = "XenoCoop2026"; 
            var domain = "gmail.com"; 
            var teljesEmail = felhasznalo + "@" + domain;

            // Megjelenítjük a rejtett dobozt és beillesztjük a linket
            var doboz = document.getElementById("email-doboz");
            var helye = document.getElementById("email-helye");
            
            helye.innerHTML = '<a href="mailto:' + teljesEmail + '">' + teljesEmail + '</a>';
            doboz.style.display = "block";
        }
    }
</script>

</body>
</html>
